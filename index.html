<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 기기에서 화면 비율을 맞추기 위한 필수 메타 태그 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YUYEON BIRTHDAY SPECIAL PAGE</title>
    <style>
        /* 폰트 적용 */
        @font-face {
            font-family: 'Paperlogy';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            /* 모바일에서 버튼 탭할 때 생기는 파란색 하이라이트 제거 */
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            background: #0e0e12; 
            color: #fff; 
            font-family: 'Paperlogy', sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* 화면 전체 높이 사용 */
            padding: 20px;
        }
        
        /* --- 헤더 (타이틀) 영역 --- */
        .header-container {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 { 
            font-size: 2.2rem; 
            margin: 0 0 12px 0;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(108, 92, 231, 0.4); 
            line-height: 1.3;
        }

        .page-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            font-weight: normal;
        }

        /* --- 내비게이션 메뉴 영역 --- */
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1c1c2e;
            color: #fff;
            text-decoration: none;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: #6c5ce7;
            border-color: #6c5ce7;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        /* --- 모바일 디테일 최적화 --- */
        @media (max-width: 600px) {
            body {
                padding: 15px; /* 모바일 좌우 여백 축소 */
            }

            .header-container {
                margin-bottom: 35px; /* 제목과 메뉴 사이 간격 축소 */
            }

            h1 { 
                font-size: 1.6rem; /* 모바일 화면에 맞게 제목 크기 축소 */
                margin-bottom: 8px;
            }

            .page-desc {
                font-size: 0.9rem; /* 부제목 크기 축소 */
                padding: 0 10px;
                word-break: keep-all; /* 모바일에서 단어 단위로 텍스트가 잘리지 않게 설정 */
                line-height: 1.4;
            }

            .nav-menu {
                gap: 12px; /* 버튼 사이 간격 축소 */
                max-width: 100%; /* 모바일에서는 가로 폭을 꽉 채우도록 설정 */
            }

            .nav-btn { 
                padding: 16px; /* 터치하기 편한 높이 유지하되 살짝 축소 */
                font-size: 1.05rem; 
                border-radius: 10px; 
            }
            
            /* 모바일 기기에서는 hover 효과 제거 (터치 후 잔상 방지) */
            .nav-btn:active {
                background: #6c5ce7;
                border-color: #6c5ce7;
                transform: scale(0.98); /* 누를 때 살짝 들어가는 효과 */
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>YUYEON BIRTHDAY<br>SPECIAL PAGE</h1>
        <div class="page-desc">유연이 생일 기념 스페셜 웹페이지</div>
    </div>

    <!-- 메뉴 버튼 영역 -->
    <div class="nav-menu">
        <a href="summerfilp.html" class="nav-btn">SummerFilp</a>
        <a href="miniroom.html" class="nav-btn">MiniRoom</a>
        <a href="visit.html" class="nav-btn">방명록</a>
    </div>

</body>
</html>
